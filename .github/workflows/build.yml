name: Build GKI

on:
  workflow_call:
    inputs:
      TODO:
        type: string
      KSU:
        type: string
      KSU_SUSFS:
        type: string
      KSU_MANUAL_HOOK:
        type: string
      LAST_BUILD:
        type: string
      KERNEL_BRANCH:
        type: string

  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      KSU:
        description: KernelSU variant
        default: "Suki"
        type: choice
        options:
          - "None"
          - "Next"
          - "Suki"
          - "Magic"

      KSU_SUSFS:
        description: Include SUSFS?
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      KSU_MANUAL_HOOK:
        description: Use KSU Manual Hooks?
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

      KERNEL_BRANCH:
        description: GKI kernel branch (AOSP kernel/common)
        default: "android12-5.10-2026-07"
        type: choice
        options:
          - "android12-5.10-2026-07"
          - "android12-5.10-2026-04"
          - "android12-5.10-2025-12"
          - "android12-5.10-lts"

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine Build Status
        run: |
          if [ "${{ toJson(github.event.inputs) }}" == "null" ]; then
            echo "STATUS=RELEASE" >> $GITHUB_ENV
            echo "TRIGGER=workflow_call" >> $GITHUB_ENV
          else
            echo "STATUS=BETA" >> $GITHUB_ENV
            echo "TRIGGER=workflow_dispatch" >> $GITHUB_ENV
          fi

      - name: Validate Inputs
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }} # telegram chat id (optional)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # telegram bot token (optional)
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
        run: |
          _error() {
              echo "❌ ERROR: $*"
              let ret++
          }

          ret=0

          # Telegram is optional; warn only.
          if [[ -z "$TG_CHAT_ID" || -z "$TG_BOT_TOKEN" ]]; then
            echo "Telegram secrets not set (TG_CHAT_ID / TG_BOT_TOKEN). Notifications will be skipped."
          fi

          # Check KernelSU variant combinations
          if [[ $KSU == "None" && $KSU_SUSFS == "true" ]]; then
              _error "Cannot use SuSFS without KernelSU"
          fi
          if [[ $KSU == "None" && $KSU_MANUAL_HOOK == "true" ]]; then
            _error "Cannot use KSU Manual Hooks without KernelSU!"
          fi

          if [[ $ret -gt 0 ]]; then
            exit $ret
          fi

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gh bc bison flex libssl-dev libelf-dev dwarves cpio

      - name: Run Build Script
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }} # telegram chat id (optional)
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }} # telegram bot token (optional)
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }} # github token
          KSU: ${{ inputs.KSU }}
          KSU_SUSFS: ${{ inputs.KSU_SUSFS }}
          KSU_MANUAL_HOOK: ${{ inputs.KSU_MANUAL_HOOK }}
          LAST_BUILD: ${{ inputs.LAST_BUILD }}
          TODO: ${{ inputs.TODO }}
          KERNEL_BRANCH: ${{ inputs.KERNEL_BRANCH }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh
          ./build.sh

      - name: Upload Artifacts (ZIP & IMG)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE_NAME }}-${{ github.run_number }}
          path: |
            artifacts/*.zip
            artifacts/*.img
          if-no-files-found: ignore

      - name: Upload Artifacts (Info File)
        uses: actions/upload-artifact@v4
        with:
          name: info-${{ inputs.KERNEL_BRANCH }}-${{ github.run_number }}
          path: artifacts/*.txt
          if-no-files-found: ignore
